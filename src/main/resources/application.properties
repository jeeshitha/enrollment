spring.application.name=enrollment

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?currentSchema=postgres
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=postgres
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
spring.jpa.properties.hibernate.jdbc.timeout=5
spring.jpa.open-in-view=false
spring.transaction.default-timeout=10s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=enrollment-waitlist-promoter
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.max-poll-interval=300000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
app.kafka.waitlist-promotion-topic=course-seat-available
app.kafka.publish-timeout=5s
app.kafka.listener.concurrency=3
app.kafka.outbox-poll-interval=1000
