spring.datasource.url=jdbc:h2:mem:enrollment-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=enrollment-waitlist-test
app.kafka.waitlist-promotion-topic=course-seat-available-test
app.kafka.outbox-poll-interval=3600000
